aid: being
name: Being
description: Being (Being Juice, operated by Being Global Sdn Bhd) is a Malaysian smoothie
  and cold-pressed juice brand founded by Sayantan Das, the former CEO of foodpanda Malaysia
  and Brunei, on the promise that "you are what you drink." The company sources ingredients
  from local farmers and handcrafts fresh, feel-good smoothies and juices daily, sold
  through physical outlets across the Klang Valley and through a mobile rewards app. Being
  is backed by 500 Global and was added to the API Evangelist network as a portfolio company
  profile awaiting enrichment. It publishes a consumer web presence but no public developer
  API surface at this time.
